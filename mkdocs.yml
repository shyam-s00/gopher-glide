site_name: Gopher Glide (gg)
site_description: High-fidelity API traffic simulation from your IDE. Beyond brute-force load testing.
site_url: https://gopherglide.dev
repo_url: https://github.com/shyam-s00/gopher-glide
copyright: Released under the MIT License. Built with ❤️ by Shiyam.

theme:
  name: material
  logo: assets/ggToolIcon_dark.svg
  favicon: assets/pluginIcon.svg
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/gopher.css

nav:
  - Home: index.md
  - Load Profiles: profiles.md
  - Benchmarks: BENCHMARKS.md
  - The TUI: tui.md
  - Snapshots (gg snap): snap.md
  - JetBrains Plugin: plugin.md
  - Configuration: configuration.md
